name: macOS Qt6 Scopy Build

on:
    workflow_call:
    workflow_dispatch:

env:
  USERNAME: github-actions
  CACHING_ENABLED: 'false'
  JOBS: '3'
  ENABLE_PACKAGE_M2K: 'ON'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macOS 15 Qt6 (ARM64)
            artifact: Scopy-macOS15-arm64-qt6
          - runner: macos-15-intel
            name: macOS 15 Qt6 (Intel)
            artifact: Scopy-macOS15-x86_64-qt6

    steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: Build and Install Dependencies
          run: |
            bash ci/macOS/install_macos_deps.sh

        - name: Build Scopy
          run: |
            ENABLE_TESTING=ON bash ci/macOS/build_macos.sh

        - name: Run hardware-free tests
          env:
            QT_QPA_PLATFORM: offscreen
          run: |
            ctest --test-dir build -E 'pluginloader|scopy-iioutil_test_connectionprovider' --output-on-failure --timeout 60
            ctest --test-dir build -R '^scopy-m2k_test_pluginloader$' --no-tests=error --output-on-failure --timeout 60

        - name: Create Scopy.dmg
          run: bash ci/macOS/package_darwin.sh

        - name: Verify relocated standalone app
          run: |
            ditto build/Scopy.app "$RUNNER_TEMP/Scopy.app"
            python3 ci/macOS/verify_bundle.py "$RUNNER_TEMP/Scopy.app" "$(uname -m)"
            env -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u QT_QPA_PLATFORM "$RUNNER_TEMP/Scopy.app/Contents/MacOS/Scopy" --accept-license --script="$GITHUB_WORKSPACE/ci/macOS/smoke.js" > build/package-smoke.log 2>&1
            grep -q 'Script finished with status 0' build/package-smoke.log
            grep -q 'Scopy finished gracefully' build/package-smoke.log
            grep -q 'Found plugin: "M2kPlugin"' build/package-smoke.log

        - name: Set short git commit SHA
          run: echo "commit_sha=$(git rev-parse --short ${{ github.sha }})" >> "$GITHUB_ENV"

        - uses: actions/upload-artifact@v7
          if: always()
          with:
            name: ${{ matrix.artifact }}-${{ env.commit_sha }}
            path: |
              build/Scopy.dmg
              build/ScopyApp.zip
              build/package-smoke.log
